[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netconf-yang-tools"
version = "0.1.0"
description = "Tools for a NETCONF client to interact with a NETCONF server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Mahesh Jethanandani", email = "mjethanandani@gmail.com"},
]
dependencies = [
    "ncclient>=0.6.13",
    "lxml>=4.9",
]

[project.urls]
Homepage = "https://github.com/mjethanandani/nctools"
Issues = "https://github.com/mjethanandani/nctools/issues"

[project.scripts]
nctools = "nctools.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
